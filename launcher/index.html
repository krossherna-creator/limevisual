<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>LimeVisuals</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.modrinth.com data:; style-src 'self' 'unsafe-inline'">
<style>
:root{--a:#a6ff00;--on:#101a00}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;color:#fff;font:14px "Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 12% 85%,rgba(255,255,255,.16),transparent 30%),linear-gradient(135deg,#2a2070,#4b3cad 55%,#6b3fb4);user-select:none}
.side{width:62px;background:rgba(10,8,40,.4);display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:20px}
.side b{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;cursor:pointer;color:#c9c4ee;font-weight:400}.side b.on{background:var(--a);color:var(--on)}
main{flex:1;min-width:0;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;font-weight:700;font-size:16px}.top i{font-style:normal;color:#c9c4ee;font-weight:400;margin-left:8px}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;backdrop-filter:blur(8px)}
.pg{display:none;flex:1;min-height:0;gap:14px}.pg.on{display:flex}
h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:#d8d3ff;text-transform:uppercase}
.vl{flex:1;padding:14px;display:flex;flex-direction:column;min-width:0}.vl .l{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.v{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer}.v.on{outline:2px solid var(--a)}.v small{color:var(--a)}
.play{width:290px;padding:16px;display:flex;flex-direction:column;gap:6px}
label{font:700 11px sans-serif;letter-spacing:.1em;color:#e4e0ff;margin-top:6px}
.f{display:flex;gap:8px;align-items:center;background:rgba(20,10,70,.55);border:1px solid rgba(255,255,255,.2);border-radius:11px;padding:8px 10px;font-weight:700}
.f input,.f select{all:unset;flex:1;min-width:0;color:#fff;font-weight:700}.f select option{color:#000}
.lnk{font-size:12px;color:#d8d3ff;text-decoration:underline;cursor:pointer}
.go{margin-top:10px;border:0;border-radius:13px;padding:13px;font:800 14px "Segoe UI";letter-spacing:.14em;cursor:pointer;background:linear-gradient(90deg,var(--a),#7dffb0);color:var(--on)}.go:disabled{opacity:.6}
.pb{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:8px}.pb i{display:block;height:100%;width:0;background:var(--a);border-radius:3px}
#log{height:90px;overflow:auto;font:11px Consolas,monospace;color:#cfcaf2;background:rgba(0,0,0,.25);border-radius:8px;padding:6px;margin-top:6px}
.upd{display:none;padding:10px 14px;align-items:center;gap:10px;font-size:12px}.upd span{flex:1}
.btn{border:0;border-radius:10px;padding:7px 14px;font:700 12px "Segoe UI";cursor:pointer;color:var(--on);background:var(--a)}.btn.g{background:rgba(255,255,255,.14);color:#fff}
.mt{flex:1;padding:14px;display:flex;gap:14px;min-width:0}.mt .l{width:220px;flex:none;display:flex;flex-direction:column;gap:8px}.mt .r{flex:1;min-width:0;display:flex}
.tb{display:flex;gap:8px}.tb button{flex:1;border:0;border-radius:10px;padding:8px;font:700 12px "Segoe UI";cursor:pointer;background:rgba(255,255,255,.12);color:#fff}.tb button.on{background:var(--a);color:var(--on)}
.in{background:rgba(20,10,70,.55);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 10px;color:#fff;font:inherit;width:100%;outline:0}.in option{color:#000}
.cat{display:flex;flex-wrap:wrap;gap:6px}.cat span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:4px 9px;font-size:12px;cursor:pointer}.cat span.on{border-color:#ff9d4d;color:#ffb27a}
.lst{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.it{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:9px 11px}
.it img,.it .ic{width:44px;height:44px;border-radius:9px;flex:none;background:#3a3470}.it .t{flex:1;min-width:0}.it b{display:block}.it small{display:block;color:#cfcaf2;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:36px;height:20px;border-radius:10px;background:#3a3470;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#bbb}.sw.on{background:var(--a)}.sw.on:after{left:19px;background:var(--on)}
</style></head><body>
<div class="side"><b id="n0" class="on">⌂</b><b id="n1">⚙</b></div>
<main>
 <div class="top">🍋 LimeVisuals<i id="crumb">/ Home</i></div>
 <div class="glass upd" id="upd"><span><b id="ut"></b><br>Скачано в фоне — можно продолжать играть</span><button class="btn g" id="ul">Later</button><button class="btn" id="ui">Update</button></div>

 <div class="pg on" id="p0">
  <div class="glass vl"><h3>Версии Minecraft</h3><div class="l" id="vl"></div></div>
  <div class="glass play">
   <label>USERNAME</label><div class="f"><input id="nm" maxlength="16" spellcheck="false" placeholder="ник"><span class="lnk" id="nu">＋ new</span></div>
   <select class="in" id="acc" style="display:none"></select>
   <span class="lnk" id="ms">or sign in with Microsoft</span>
   <label>VERSION</label><div class="f"><select id="ver"></select></div>
   <label>LOADER</label><div class="f"><select id="ldr"><option>Fabric</option><option>Vanilla</option></select></div>
   <label>RAM (GB)</label><div class="f"><input id="ram" type="number" min="1" max="32" value="4"></div>
   <button class="go" id="go">PLAY</button><div class="pb"><i id="pb"></i></div><div id="log"></div>
  </div>
 </div>

 <div class="pg" id="p1"><div class="glass mt">
  <div class="l"><div class="tb"><button id="tI">Installed</button><button id="tB" class="on">Browse Modrinth</button></div>
   <select class="in" id="typ"><option value="mod">Mods</option><option value="resourcepack">Resource Packs</option><option value="shader">Shaders</option></select>
   <input class="in" id="qs" placeholder="Search Modrinth…"><h3 style="margin:6px 0 0">Categories</h3><div class="cat" id="cats"></div><span class="lnk" id="clr">Clear filters</span></div>
  <div class="r"><div class="lst" id="lst"></div></div></div></div>
</main><script src="renderer.js"></script></body></html>
